#
# Same baseline as umode_emlearn, plus a bigger main stack so it can
# be carved into 4 per-shire slices by entry.S in phase 2 of the POC.
# 4 shires × 4 KiB each = 16 KiB total stack region.

CONFIG_MULTITHREADING=n
CONFIG_BOOT_BANNER=n

# Per-shire stack carving in entry.S: 4 shires x 4096 bytes = 16384.
# CONFIG_MAIN_STACK_SIZE must therefore be at least 4 * 4096 so that
# z_main_stack has room for all four slices.
CONFIG_AIFOUNDRY_PER_SHIRE_STACK=y
CONFIG_AIFOUNDRY_PER_SHIRE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=16384

CONFIG_EMLEARN=y
