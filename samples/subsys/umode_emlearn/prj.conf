# Common settings.  Board-specific overlays in boards/<board>.conf
# pick between U-mode (ET-SoC1, needs ring-buffer output + ecall exit)
# and M-mode (Erbium, native Zephyr-M with real UART).

CONFIG_PRINTK=y
CONFIG_MULTITHREADING=n
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=2048
# No heap — classifier is pure arithmetic over static arrays.
CONFIG_HEAP_MEM_POOL_SIZE=0
