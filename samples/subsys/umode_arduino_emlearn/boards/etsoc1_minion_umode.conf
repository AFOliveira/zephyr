#
# etsoc1_minion_umode build of the Arduino emlearn sample.
#
# Architecture choice on this board: we use ArduinoCore-zephyr's
# `ZephyrSerialStub`, which is selected automatically when
# `zephyr,user` has no `serials` property AND there is no
# `arduino_serial` DT label.  ZephyrSerialStub's `write()` calls
# `printk("%c", c)`.  We re-route Zephyr's printk through our virtual
# trace UART driver (uart_aifoundry_trace) so the bytes land in the
# et-trace ring.  This avoids the upstream ZephyrSerial's reliance on
# k_sem (which needs CONFIG_MULTITHREADING=y, which would need a real
# clock source — not available in U-mode).

# Stay single-threaded: the U-mode board has no usable clock source
# (firmware sets mcounteren=0, no machine timer is mapped in U).
# CONFIG_ARDUINO_API `imply`s things that pull in kernel/timeout.c
# (sys_clock_elapsed); since we have no clock, turn the timer
# subsystem off entirely and let nothread.c's busy-wait fallback
# implement k_sleep / k_busy_wait via cycle loops.
CONFIG_MULTITHREADING=n
CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_BUSYWAIT_CPU_LOOPS_PER_USEC=500

# Bring printk online but NOT the uart_console plumbing — we install
# our own printk hook at boot that calls aifoundry_log directly,
# bypassing the entire UART driver chain.  uart_console + the chosen
# console glue introduces timing-fragile call sites (some early
# format string ends up dereferencing a wild pointer through
# picolibc's vfprintf -> strlen, observable as a load access fault
# during boot on real silicon).  Going straight to the trace ring is
# simpler and matches what umode_emlearn does for plain `printk`-free
# output today.
#
# SERIAL must be y because CONFIG_ARDUINO_API select-forces
# UART_INTERRUPT_DRIVEN (and that requires SERIAL_SUPPORT_INTERRUPT &&
# SERIAL).  We also wire up the virtual trace UART so the driver has a
# DT node to instantiate against — but no `chosen { zephyr,console }`
# is set in the variant overlay, so the upstream uart_console driver
# is never bound.  CONSOLE/UART_CONSOLE off keeps printk from being
# dispatched through the chosen-uart machinery; instead the printk
# hook installed by soc/aifoundry/etsoc1_minion_umode/runtime.c
# forwards each byte directly to aifoundry_log → et-trace ring.
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_AIFOUNDRY_TRACE=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# The ET-SoC1 launcher's elf-loader (esperanto-tools-libs/src/RuntimeImp.cpp
# RuntimeImp::doLoadCode) writes file bytes verbatim at
# `deviceBuffer + segment_offset`, then jumps to
# `deviceBuffer + entry - (loadAddress - segment_offset)`.  For
# absolute-address reads to resolve correctly we need
# linker_RAM_BASE == deviceBuffer + segment_offset.  The loader's malloc
# returns deviceBuffer == 0x8006335000 (the historical kernel base) and
# the LOAD segment file offset is 0xb0 (sizeof(ELF header) + 2 PHDRs), so
# the kernel's RAM_BASE must be 0x8006335000 + 0xb0 = 0x80063350b0 for the
# initlevel / device_area / rodata absolute reads done by Arduino-Core's
# device init walker to land on the bytes the linker actually wrote.
# The umode_emlearn baseline gets away with the historical 0x8006335000
# only because it never reads any static initialised data through an
# absolute address — it has zero SYS_INIT entries and zero device_area
# entries, so the for-loop in z_sys_init_run_level immediately exits.
CONFIG_SRAM_BASE_ADDRESS=0x80063350b0
