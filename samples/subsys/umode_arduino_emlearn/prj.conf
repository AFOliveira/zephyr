#
# Arduino-flavoured emlearn demo.
#
# Common settings between the M-mode (erbium_minion) and U-mode
# (etsoc1_minion_umode) builds.  Per-board overrides live in
# boards/<board>.conf.

CONFIG_BOOT_BANNER=n
# 16 KiB main stack: ArduinoCore-zephyr's Print/Stream layer + emlearn's
# decision-tree recursion + the U-mode sketch's stack frames combined
# overflow the default 4 KiB on etsoc1_minion_umode (observed as a
# load access fault deep inside k_sleep -> k_busy_wait when sp drifted
# below z_main_stack base).
CONFIG_MAIN_STACK_SIZE=16384

# Pull in upstream ArduinoCore-zephyr.  This `imply`s CPP / GPIO / I2C
# / NEWLIB_LIBC_FLOAT_PRINTF / CBPRINTF_FP_SUPPORT / RING_BUFFER and
# `select`s UART_INTERRUPT_DRIVEN.
CONFIG_ARDUINO_API=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=n

# Sketch's `loop()` exits the kernel after this many full passes over
# the iris vectors.  3 is enough to see Serial output and produces
# 5+1=6 lines per pass (15 prediction lines + 3 emlearn-arduino done
# lines + the setup banner).  The ET-SoC1 launcher's default
# --kernel_launch_timeout=30 is generous for that workload.
CONFIG_AIFOUNDRY_ARDUINO_LOOP_COUNT=3
