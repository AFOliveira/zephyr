CONFIG_PRINTK=y
CONFIG_SOC_AIFOUNDRY_ERBIUM_UMODE=y

# We deliberately do NOT enable CONFIG_USERSPACE: the M->U->M round-trip is
# driven by our own launcher/dispatcher rather than Zephyr's userspace/PMP
# machinery.  Keeping USERSPACE off also means Zephyr's isr.S routes ECALLU
# straight to z_riscv_fault, which is exactly where our override lives.
